name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.8
      - name: Compilar
        run: |
          FOUND=$(find . -name build.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$FOUND" ]; then
            echo "ERRO: o ficheiro build.gradle nao foi encontrado no repositorio. Faltou carregar os ficheiros."
            exit 1
          fi
          DIR=$(dirname "$FOUND")
          echo "Projeto encontrado em: $DIR"
          cd "$DIR"
          if [ -f physics-test/run.sh ]; then
            echo "A correr os testes de fisica..."
            sh physics-test/run.sh
          fi
          gradle build
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp $(ls build/libs/*.jar | grep -v -- '-sources') "$GITHUB_WORKSPACE/out/"
      - uses: actions/upload-artifact@v4
        with:
          name: rlcars-jar
          path: out/*.jar
